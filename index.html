<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pronóstico del Clima</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body {
            background-color: #f3efe6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #ffffff;
        }
        .card {
            background: #738271;
            border-radius: 12px;
            padding: 25px;
            width: 100%;
            max-width: 550px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            text-align: center;
        }
        .search-container {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
        }
        .search-container input {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
            outline: none;
        }
        .search-container button {
            padding: 10px 15px;
            border: none;
            border-radius: 8px;
            background: #4a5749;
            color: #fff;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .search-container button:hover {
            background: #364035;
        }
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        select, input[type="date"] {
            flex: 1;
            min-width: 140px;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.9);
            color: #333;
            font-size: 14px;
            outline: none;
        }
        .city-name { font-size: 24px; font-weight: normal; margin-bottom: 5px; word-break: break-word; }
        .date-selected { font-size: 14px; opacity: 0.85; margin-bottom: 10px; text-transform: capitalize; }
        
        .main-info { display: flex; justify-content: center; align-items: center; gap: 15px; margin: 15px 0; }
        .temp-main { font-size: 48px; font-weight: 300; }
        .weather-icon { font-size: 32px; }
        .desc-main { font-size: 16px; margin-bottom: 15px; text-transform: capitalize; }
        
        .metrics {
            display: flex;
            justify-content: center;
            gap: 20px;
            font-size: 13px;
            opacity: 0.9;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 15px;
        }

        .hourly-title { text-align: left; font-size: 14px; margin-bottom: 8px; opacity: 0.8; }
        .hourly-scroll {
            display: flex;
            overflow-x: auto;
            gap: 15px;
            padding-bottom: 10px;
            margin-bottom: 15px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.5) transparent;
        }
        .hourly-scroll::-webkit-scrollbar { height: 6px; }
        .hourly-scroll::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.4); border-radius: 10px; }
        
        .hour-item {
            flex: 0 0 auto;
            text-align: center;
            width: 50px;
        }
        .hour-item p { font-size: 12px; }
        .hour-item .h-temp { font-size: 14px; font-weight: bold; margin-top: 4px; }

        .daily-title { text-align: left; font-size: 14px; margin-bottom: 8px; opacity: 0.8; }
        .daily-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 200px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .daily-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.1);
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .daily-item:hover { background: rgba(255, 255, 255, 0.25); }
    </style>
</head>
<body>

<div class="card">
    <!-- Buscador de Ubicación manual -->
    <div class="search-container">
        <input type="text" id="cityInput" placeholder="Busca un salón, dirección o lugar..." onkeypress="handleKeyPress(event)">
        <button onclick="searchCustomLocation()">Buscar</button>
    </div>

    <!-- Seleccionar Estado de MX y Fecha -->
    <div class="controls">
        <select id="stateSelect" onchange="selectState()">
            <option value="21.8823,-102.2826">Aguascalientes</option>
            <option value="32.5149,-117.0382">Baja California (Tijuana)</option>
            <option value="24.1426,-110.3128">Baja California Sur (La Paz)</option>
            <option value="19.8439,-90.5255">Campeche</option>
            <option value="16.7569,-93.1292">Chiapas (Tuxtla Gtz.)</option>
            <option value="28.6330,-106.0691">Chihuahua</option>
            <option value="27.4864,-101.0223">Coahuila (Saltillo)</option>
            <option value="19.2433,-103.7247">Colima</option>
            <option value="19.4326,-99.1332">CDMX</option>
            <option value="24.0277,-104.6532">Durango</option>
            <option value="20.9140,-101.2568">Guanajuato</option>
            <option value="17.5515,-99.5005">Guerrero (Chilpancingo)</option>
            <option value="20.1011,-98.7591">Hidalgo (Pachuca)</option>
            <option value="20.6597,-103.3496">Jalisco (Guadalajara)</option>
            <option value="19.3552,-99.6549">Estado de México (Toluca)</option>
            <option value="19.7008,-101.1844">Michoacán (Morelia)</option>
            <option value="18.9261,-99.2307">Morelos (Cuernavaca)</option>
            <option value="21.4881,-104.8942">Nayarit (Tepic)</option>
            <option value="25.6866,-100.3161" selected>Nuevo León (Monterrey)</option>
            <option value="17.0732,-96.7266">Oaxaca</option>
            <option value="19.0414,-98.2063">Puebla</option>
            <option value="20.5888,-100.3899">Querétaro</option>
            <option value="21.1619,-86.8515">Quintana Roo (Cancún)</option>
            <option value="22.1565,-100.9855">San Luis Potosí</option>
            <option value="24.8091,-107.3940">Sinaloa (Culiacán)</option>
            <option value="29.0729,-110.9559">Sonora (Hermosillo)</option>
            <option value="17.9892,-92.9281">Tabasco (Villahermosa)</option>
            <option value="23.7369,-99.1411">Tamaulipas (Cd. Victoria)</option>
            <option value="19.3182,-98.2375">Tlaxcala</option>
            <option value="19.5438,-96.9102">Veracruz (Xalapa)</option>
            <option value="20.9674,-89.5926">Yucatán (Mérida)</option>
            <option value="22.7709,-102.5832">Zacatecas</option>
        </select>

        <input type="date" id="datePicker" onchange="updateWeather()">
    </div>

    <h1 class="city-name" id="cityName">Monterrey</h1>
    <div class="date-selected" id="dateDisplay">--</div>
    
    <div class="main-info">
        <div class="temp-main" id="currentTemp">--°C</div>
        <div class="weather-icon" id="currentIcon">🌧️</div>
    </div>
    <div class="desc-main" id="currentDesc">Cargando clima...</div>

    <div class="metrics">
        <span id="wind">💨 -- km/h</span>
        <span id="humidity">💧 --%</span>
        <span id="pressure">🧭 -- mmHg</span>
    </div>

    <div class="hourly-title" id="hourlyTitle">Horario (06:00 - 24:00)</div>
    <div class="hourly-scroll" id="hourlyContainer"></div>

    <div class="daily-title">Pronóstico Próximos Días</div>
    <div class="daily-list" id="dailyContainer"></div>
</div>

<script>
    let currentLat = 25.6866;
    let currentLon = -100.3161;
    let currentCityName = "Nuevo León";

    const weatherCodes = {
        0: { desc: "Cielo Despejado", icon: "☀️" },
        1: { desc: "Principalmente Despejado", icon: "🌤️" },
        2: { desc: "Parcialmente Nublado", icon: "⛅" },
        3: { desc: "Nublado", icon: "☁️" },
        45: { desc: "Niebla", icon: "🌫️" },
        51: { desc: "Llovizna Ligera", icon: "🌧️" },
        61: { desc: "Lluvia Moderada", icon: "🌧️" },
        80: { desc: "Chubascos", icon: "🌦️" },
        95: { desc: "Tormenta Eléctrica", icon: "⛈️" }
    };

    const today = new Date();
    const maxDate = new Date();
    maxDate.setDate(today.getDate() + 15);

    const datePicker = document.getElementById('datePicker');
    datePicker.value = today.toISOString().split('T')[0];
    datePicker.min = today.toISOString().split('T')[0];
    datePicker.max = maxDate.toISOString().split('T')[0];

    function selectState() {
        const select = document.getElementById('stateSelect');
        const [lat, lon] = select.value.split(',');
        currentLat = parseFloat(lat);
        currentLon = parseFloat(lon);
        currentCityName = select.options[select.selectedIndex].text.split(' (')[0];
        document.getElementById('cityInput').value = '';
        updateWeather();
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            searchCustomLocation();
        }
    }

    async function searchCustomLocation() {
        const query = document.getElementById('cityInput').value.trim();
        if (!query) return;

        document.getElementById('currentDesc').innerText = "Buscando ubicación...";

        try {
            // Usamos la API de Nominatim (OpenStreetMap) que encuentra nombres de locales y direcciones completas
            const nomUrl = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(query)}&format=json&limit=1&addressdetails=1`;
            const nomRes = await fetch(nomUrl, {
                headers: { 'User-Agent': 'MiClimaApp/1.0' }
            });
            const nomData = await nomRes.json();

            if (nomData && nomData.length > 0) {
                const place = nomData[0];
                currentLat = parseFloat(place.lat);
                currentLon = parseFloat(place.lon);
                
                // Formatear un nombre corto legible del lugar
                const addr = place.address;
                const placeName = place.name || addr.amenity || addr.building || addr.road || query;
                const cityName = addr.city || addr.town || addr.village || addr.state || "";
                
                currentCityName = cityName ? `${placeName}, ${cityName}` : placeName;
                updateWeather();
            } else {
                alert("Ubicación no encontrada. Intenta escribir el nombre del lugar junto a la ciudad (ej. 'Salón de la Fama, Monterrey').");
                document.getElementById('currentDesc').innerText = "Sin resultados";
            }
        } catch (error) {
            alert("Error al realizar la búsqueda de la ubicación.");
        }
    }

    async function updateWeather() {
        const selectedDateStr = datePicker.value;
        document.getElementById('cityName').innerText = currentCityName;

        const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&current=temperature_2m,relative_humidity_2m,weather_code,surface_pressure,wind_speed_10m&hourly=temperature_2m,relative_humidity_2m,weather_code,wind_speed_10m,surface_pressure&daily=weather_code,temperature_2m_max,temperature_2m_min&forecast_days=16&timezone=auto`;

        try {
            const res = await fetch(url);
            const data = await res.json();

            const dayIndex = data.daily.time.indexOf(selectedDateStr);
            const isToday = selectedDateStr === today.toISOString().split('T')[0];

            const dateObj = new Date(selectedDateStr + "T00:00:00");
            document.getElementById('dateDisplay').innerText = dateObj.toLocaleDateString('es-ES', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

            const dailyCode = weatherCodes[data.daily.weather_code[dayIndex]] || { desc: "Variable", icon: "🌡️" };
            document.getElementById('currentIcon').innerText = dailyCode.icon;
            document.getElementById('currentDesc').innerText = dailyCode.desc;

            if (isToday) {
                document.getElementById('currentTemp').innerText = `${Math.round(data.current.temperature_2m)}°C`;
                document.getElementById('wind').innerText = `💨 ${Math.round(data.current.wind_speed_10m)} km/h`;
                document.getElementById('humidity').innerText = `💧 ${data.current.relative_humidity_2m}%`;
                document.getElementById('pressure').innerText = `🧭 ${Math.round(data.current.surface_pressure * 0.750062)} mmHg`;
            } else {
                const maxT = Math.round(data.daily.temperature_2m_max[dayIndex]);
                const minT = Math.round(data.daily.temperature_2m_min[dayIndex]);
                document.getElementById('currentTemp').innerText = `${maxT}° / ${minT}°C`;
                
                const startHour = dayIndex * 24 + 12;
                document.getElementById('wind').innerText = `💨 ${Math.round(data.hourly.wind_speed_10m[startHour])} km/h`;
                document.getElementById('humidity').innerText = `💧 ${data.hourly.relative_humidity_2m[startHour]}%`;
                document.getElementById('pressure').innerText = `🧭 ${Math.round(data.hourly.surface_pressure[startHour] * 0.750062)} mmHg`;
            }

            const hourlyContainer = document.getElementById('hourlyContainer');
            hourlyContainer.innerHTML = '';
            
            const startHourIndex = dayIndex * 24;
            const dayHours = data.hourly.time.slice(startHourIndex, startHourIndex + 25);

            dayHours.forEach((timeStr, idx) => {
                const hour = new Date(timeStr).getHours();
                const globalIndex = startHourIndex + idx;

                if (hour >= 6 || hour === 0) {
                    const hCode = weatherCodes[data.hourly.weather_code[globalIndex]] || { icon: "☁️" };
                    const item = document.createElement('div');
                    item.className = 'hour-item';
                    item.innerHTML = `
                        <p>${hour === 0 ? '24:00' : (hour < 10 ? '0' + hour : hour) + ':00'}</p>
                        <div style="margin: 4px 0;">${hCode.icon}</div>
                        <div class="h-temp">${Math.round(data.hourly.temperature_2m[globalIndex])}°C</div>
                    `;
                    hourlyContainer.appendChild(item);
                }
            });

            const dailyContainer = document.getElementById('dailyContainer');
            dailyContainer.innerHTML = '';

            data.daily.time.forEach((dStr, idx) => {
                const dDate = new Date(dStr + "T00:00:00");
                const dayName = dDate.toLocaleDateString('es-ES', { weekday: 'short', day: 'numeric', month: 'short' });
                const dCode = weatherCodes[data.daily.weather_code[idx]] || { icon: "🌤️" };
                const maxTemp = Math.round(data.daily.temperature_2m_max[idx]);
                const minTemp = Math.round(data.daily.temperature_2m_min[idx]);

                const item = document.createElement('div');
                item.className = 'daily-item';
                item.onclick = () => {
                    datePicker.value = dStr;
                    updateWeather();
                };
                item.innerHTML = `
                    <span style="width: 130px; text-align: left; text-transform: capitalize;">${dayName}</span>
                    <span>${dCode.icon}</span>
                    <span><strong>${maxTemp}°C</strong> / ${minTemp}°C</span>
                `;
                dailyContainer.appendChild(item);
            });

        } catch (e) {
            document.getElementById('currentDesc').innerText = "Error al obtener la información";
        }
    }

    updateWeather();
</script>

</body>
</html>
